<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelter 12</title>
<meta property="og:title" content="Shelter 12">
<meta property="og:description" content="Кто останется снаружи? Игра для компании на одном столе.">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0d0f0e; color: #e8e4d9;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 24px;
  }
  h1 { font-size: 28px; letter-spacing: .04em; margin: 0 0 8px; }
  p { color: #9aa095; margin: 0 0 28px; }
  .stores { display: flex; flex-direction: column; gap: 12px; width: min(320px, 100%); margin: 0 auto; }
  a {
    display: block; padding: 14px 20px; border-radius: 12px;
    background: #1c2b22; color: #b9f2c0; border: 1px solid #2f4a39;
    text-decoration: none; font-weight: 600;
  }
  a:hover { background: #23382c; }
  small { display: block; margin-top: 24px; color: #6d736a; }
</style>
</head>
<body>
  <main>
    <h1>SHELTER 12</h1>
    <p>Открываю магазин…</p>
    <div class="stores">
      <a id="ios" href="https://apps.apple.com/app/id6805146649">Скачать в App Store</a>
      <a id="android" href="https://play.google.com/store/apps/details?id=com.shelter12.app">Скачать в Google Play</a>
    </div>
    <small>Если ничего не открылось — выбери магазин сам.</small>
  </main>
<script>
  // Перенаправляем только телефон: на компьютере скачивать нечего, там просто две кнопки.
  var ua = navigator.userAgent || "";
  var apple = /iPhone|iPad|iPod/i.test(ua);
  // iPadOS притворяется маком, поэтому его ловим по тач-экрану, а не по имени.
  var newIpad = /Macintosh/i.test(ua) && navigator.maxTouchPoints > 1;
  var android = /Android/i.test(ua);
  var target = (apple || newIpad) ? document.getElementById("ios").href
             : android ? document.getElementById("android").href
             : null;
  if (target) {
    location.replace(target);
  } else {
    document.querySelector("p").textContent = "Игра для телефона. Выбери свой магазин:";
  }
</script>
</body>
</html>
